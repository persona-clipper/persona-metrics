<form action="/organizations" method="post" class="signup-form">
    <label>
        <input type="text" name="name" placeholder="Введите уникальный идентификатор" required>
    </label>
    <label>
        <input type="text" name="display_name" required placeholder="Введите желаемое имя организации">
    </label>
    <label>
        <textarea
                type="text"
                name="description"
                placeholder="Введите описание организации"
                class="resize-none w-full!"></textarea>
    </label>

    <button type="submit">Отправить</button>
</form>
