<a href="/organizations/create" class="p-2 bg-gray-400 shadow">Создать организацию</a>

<div class="organizations">
    {% for item in items %}
        <div class="text-center my-10 mx-auto max-w-md">
            <p class="font-bold text-lg">{{ item.display_name }}</p>
            {% if let Some(description) = item.description %}
                <p class="text-gray-600 mt-2">{{ description }}</p>
            {% endif %}
            <a href="/organizations/{{ item.unique_hash_id }}">Перейти</a>
        </div>
    {% endfor %}
</div>
