<div class="flex w-full justify-center items-center">
    <form action="/organizations" method="post" class="signup-form">
        <label>
            <input type="text" name="display_name" required placeholder="Введите желаемое имя организации">
        </label>
        <label>
            <textarea
                    type="text"
                    name="description"
                    placeholder="Введите описание организации"
                    class="w-full min-h-16 max-h-60 h-30 pt-3 pb-4 resize-y border p-2"></textarea>
        </label>

        <button type="submit">Отправить</button>
    </form>
</div>
