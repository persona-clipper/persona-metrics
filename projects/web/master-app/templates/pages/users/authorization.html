<div class="signup-container">
  <form action="/login" class="signup-form" method="post">
    <h2>Авторизация</h2>
    <div class="form-input">
      <label for="username">Введите имя пользователя</label>
      <input type="text"
             id="username"
             name="username"
             maxlength="255"
             placeholder="Введите свой юзернейм"
             required>
    </div>

    <div class="form-input">
      <label for="password">Введите пароль</label>
      <input type="text" id="password" name="password" placeholder="Введите пароль" required>
    </div>

    <button type="submit">Войти &rarr;</button>

    <p class="login-link">
      <a href="/signup">Нет аккаунта? Создать аккаунт</a>
    </p>
  </form>

  {% import "components/macros/message_block.html" as scope %}

  {% if meta.session.message.is_some() %}
    {{ scope::message(meta.session.message.unwrap()) }}
  {% endif %}
</div>
