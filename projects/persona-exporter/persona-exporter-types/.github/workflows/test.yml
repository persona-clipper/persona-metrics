name: Test Code

on:
  workflow_call:

jobs:
  test_lint:
    name: Test Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "co-cache-${{hashFiles('**/Cargo.lock**')}}"

      - name: Test lint
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings

      - name: Test Code
        run: |
          cargo test --all

      - name: Test publish
        run: |
          cargo publish --dry-run