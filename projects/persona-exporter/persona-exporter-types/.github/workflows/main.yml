name: Publish and Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'


jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit
    uses: ./.github/workflows/publish.yml



