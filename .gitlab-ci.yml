image: rust:1.92

stages:
  - lint
  - test

cache:
  paths:
    - .cargo/
    - target/

format_check:
  stage: lint
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check --format=short

test_build:
  stage: test
  before_script:
    - cargo install cargo2junit || true
  script:
    - cargo test --all -- --format=json | cargo2junit > report.xml
  artifacts:
    expire_in: 1 week
    reports:
      junit: report.xml
